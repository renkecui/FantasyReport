# Deploys the website (the web/ folder on main) to GitHub Pages.
# Runs when web/ changes on main, including the daily web/league.json update, or by hand.
# Repository Settings -> Pages -> Source must be "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:  # used by update.yml after it commits new data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # the latest main, including a data commit made earlier in the same run
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
