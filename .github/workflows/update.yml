# Fetches the league from ESPN at 8 AM and 5 PM New York time (or soon after), on GitHub's servers:
# updates the Google Sheet and commits web/league.json to main, then deploys the website.
# Settings come from repository secrets; see docs/SETUP.md step 5.
name: Update league data

on:
  schedule:
    # Cron runs in UTC, and New York is UTC-4 in summer and UTC-5 in winter. GitHub also starts
    # scheduled runs late, or skips them, when it's busy. So each update has three tries an hour
    # apart, off the top of the hour; the first step lets only the first one after 8 AM / 5 PM
    # New York time do the work, however late it starts.
    - cron: "17 12,13,14 * * *"
    - cron: "17 21,22,23 * * *"
  workflow_dispatch:  # "Run workflow" button in the Actions tab (runs at any time)

permissions:
  contents: write  # push the web/league.json commit
  actions: read    # see whether an earlier try already did this update

concurrency:
  group: league-update  # never two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.when.outputs.go }}
    steps:
      - name: Only the first try after 8 AM / 5 PM in New York, once the secrets are set
        id: when
        env:
          CONFIGURED: ${{ secrets.LEAGUE_ID != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CONFIGURED" != "true" ]; then
            echo "The LEAGUE_ID secret isn't set yet (docs/SETUP.md step 5)."
            [ "$GITHUB_EVENT_NAME" = "schedule" ] && echo "go=false" >> "$GITHUB_OUTPUT" && exit 0
            echo "::error::Add the repository secrets first."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The most recent 8 AM or 5 PM in New York (in UTC), and the hours since then.
          read -r due hours < <(python3 -c '
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          due = max(t for d in (0, 1) for h in (8, 17)
                    if (t := (now - timedelta(days=d)).replace(hour=h, minute=0, second=0, microsecond=0)) <= now)
          print(due.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), int((now - due).total_seconds() // 3600))')
          if [ "$hours" -ge 4 ]; then
            echo "No update is due right now (the last one was due at $due). Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Did an earlier try since $due already deploy? (Its "deploy" job ran and succeeded.)
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/runs?created=%3E%3D$due&status=success" \
                        --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id"); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                 --jq '.jobs[] | select(.name | startswith("deploy")) | .conclusion' | grep -q success; then
              echo "Run $id already did the update due at $due. Skipping."
              echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.when.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - if: steps.when.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.when.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Set up the Google login and git
        if: steps.when.outputs.go == 'true'
        id: setup
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "No GOOGLE_TOKEN_JSON secret: updating only the website."
            echo "flags=--site-only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GOOGLE_SHEET_ID" ]; then
            # Without it every run would make a brand-new sheet.
            echo "::error::GOOGLE_SHEET_ID secret is missing (the ID from data/sheet_id.txt on the Mac)."
            exit 1
          fi
          (umask 077; printf '%s' "$GOOGLE_TOKEN_JSON" > data/token.json)
          printf '%s' "$GOOGLE_SHEET_ID" > data/sheet_id.txt
          echo "flags=" >> "$GITHUB_OUTPUT"

      - name: Fetch from ESPN and publish
        if: steps.when.outputs.go == 'true'
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          # Optional: which team's tab goes first in the sheet, and the sheet's / site's title.
          MY_TEAM_NAME: ${{ secrets.MY_TEAM_NAME }}
          SHEET_TITLE: ${{ secrets.SHEET_TITLE }}
          PUBLISH_SITE: "true"
        run: python fantasy_update.py ${{ steps.setup.outputs.flags }}

      - name: Keep backups of edited sheets
        if: always() && steps.when.outputs.go == 'true' && hashFiles('data/backups/*.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sheet-backups-${{ github.run_id }}
          path: data/backups/
          retention-days: 90

  # A push made by this workflow doesn't start other workflows, so deploy the site from here.
  deploy:
    needs: update
    if: needs.update.outputs.ran == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
